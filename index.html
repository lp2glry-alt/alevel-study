<script>
const S={
cs:{name:'Computer Science',board:'Cambridge International 9618',c:'#0d9488',topics:{
'1-1':{t:'1.1 Data representation',spec:['User-defined data types (also see later topics)','Binary, denary, hexadecimal and BCD, and converting between them','Where hex and BCD are used, and why','Character sets: ASCII, extended ASCII and Unicode','Two’s complement, binary addition and subtraction, overflow'],
guide:`<h2>Number systems</h2><ul><li><b>Denary</b> is base 10, <b>binary</b> base 2, <b>hexadecimal</b> base 16 (0–9, A–F where A=10 … F=15).</li><li><b>Binary ↔ hex:</b> split into groups of 4 bits from the right. <code>1011 0111</code> = <code>B7</code>.</li><li><b>Why hex:</b> shorter, easier for humans to read and less error-prone, and each hex digit maps to exactly 4 bits. Used for memory addresses, MAC addresses, colour codes and error messages.</li><li><b>BCD:</b> each denary digit stored in its own 4 bits. 157 = <code>0001 0101 0111</code>. Used in calculators, digital clocks and displays because decimal digits are exact and easy to show.</li></ul>
<h2>Character sets</h2><ul><li><b>ASCII:</b> 7 bits, 128 characters. <b>Extended ASCII:</b> 8 bits, 256 characters. <b>Unicode:</b> up to 32 bits per character, covers nearly every language and emoji.</li><li>Trade-off: Unicode supports far more characters but needs more storage per character.</li><li>Anchors: <code>A</code>=65, <code>a</code>=97, <code>0</code>=48.</li></ul>
<h2>Two’s complement</h2><ul><li>The MSB has a <i>negative</i> place value. In 8 bits: −128, 64, 32, 16, 8, 4, 2, 1. Range: −128 to +127.</li><li>To negate: <b>invert all bits, then add 1</b>.</li></ul>
<div class="box"><b>Worked example: −45 in 8 bits</b><br>+45 = <code>0010 1101</code> → invert <code>1101 0010</code> → add 1 → <code>1101 0011</code></div>
<h2>Binary addition and overflow</h2><ul><li>0+0=0, 0+1=1, 1+1=10 (carry 1), 1+1+1=11 (carry 1).</li><li><b>Overflow:</b> the result needs more bits than are available. In two’s complement, two positives giving a negative (or vice versa) signals overflow.</li><li><b>Subtraction:</b> add the two’s complement of the number being subtracted.</li></ul>
<div class="box"><b>Worked example: 100 − 45</b><br><code>0110 0100 + 1101 0011 = 1 0011 0111</code>. Discard the carry out of the 8th bit: <code>0011 0111</code> = 55.</div>
<h2>Exam tips</h2><ul><li>Show working (“invert, add 1”) for method marks.</li><li>State the number of bits you are using.</li><li>For “why hex?” give a specific reason, not just “it’s easier”.</li></ul>`,
tool:'bits',
qs:[['Convert 10110110 to denary, hex, and write 182 in BCD.','Denary 182. Hex B6. BCD: 0001 1000 0010.'],['Write −100 in 8-bit two’s complement.','100 = 01100100, invert = 10011011, add 1 = 10011100.'],['Add 01111000 and 01100000 in 8-bit two’s complement. What happens?','120 + 96 = 216 gives 11011000, which reads as −40. Overflow: the true answer exceeds +127 so the sign bit is wrong.'],['Give two reasons Unicode is used instead of ASCII.','It represents far more characters (all languages, symbols, emoji), and it is one international standard so text displays consistently across systems.']]}}},
eco:{name:'Economics',board:'Edexcel A 9EC0',c:'#d97706',topics:{
'1-1':{t:'Theme 1: Economics as a social science',spec:['Economics as a social science: models, ceteris paribus, rational decision-making','The economic problem: scarcity, choice, opportunity cost, factors of production','Production possibility frontiers','Specialisation and the division of labour','Free market, mixed and command economies','Positive and normative statements'],
guide:`<h2>Economics as a social science</h2><ul><li>Studies how people, firms and governments make choices with scarce resources.</li><li>Uses the scientific method: observe, build a <b>model</b>, test against data, refine.</li><li><b>Ceteris paribus</b> (“all else equal”) isolates one variable. Models simplify reality, so they cannot predict behaviour perfectly.</li><li>Assumes <b>rational</b> decisions (consumers maximise utility, firms maximise profit). Behavioural economics challenges this.</li></ul>
<h2>The economic problem</h2><ul><li><b>Scarcity:</b> limited resources against unlimited wants, which forces <b>choice</b>.</li><li><b>Factors of production:</b> land (rent), labour (wages), capital (interest), enterprise (profit).</li><li><b>Opportunity cost:</b> the value of the next best alternative given up.</li><li>Every economy answers: <i>what, how and for whom</i> to produce.</li></ul>
<h2>Production possibility frontiers</h2><ul><li>Show the maximum combinations of two goods when resources are fully and efficiently used.</li><li><b>On</b> the curve: efficient. <b>Inside:</b> unemployed or inefficient use. <b>Outside:</b> unattainable now.</li><li>Slope shows opportunity cost. A bowed-out curve means increasing opportunity cost.</li><li><b>Outward shift</b> = growth (more or better resources, technology, education). <b>Inward shift</b> = war, disaster, population loss.</li></ul>
<h2>Specialisation and division of labour</h2><ul><li><b>Benefits:</b> higher productivity, lower unit costs, economies of scale, faster training.</li><li><b>Drawbacks:</b> boredom and low morale, over-reliance on others, structural unemployment if skills become obsolete.</li></ul>
<h2>Economic systems</h2><div class="sc"><table><tr><th>System</th><th>Allocation</th><th>Strengths</th><th>Weaknesses</th></tr><tr><td>Free market</td><td>Price mechanism</td><td>Efficiency, innovation, choice</td><td>Inequality, market failure</td></tr><tr><td>Command</td><td>Government planning</td><td>Equality, public goods</td><td>Inefficiency, shortages, weak incentives</td></tr><tr><td>Mixed</td><td>Both</td><td>Balances efficiency and equity</td><td>Government failure</td></tr></table></div>
<h2>Positive vs normative</h2><ul><li><b>Positive:</b> can be tested with evidence (“Unemployment rose by 0.5%”).</li><li><b>Normative:</b> a value judgement (“The government <i>should</i> cut unemployment”). Watch for <i>should, ought, fair, better</i>.</li></ul>
<h2>Exam tips</h2><ul><li>Essays: define, analyse (chains of reasoning), evaluate (short vs long run, magnitude, assumptions), then judge.</li><li>Label PPF axes and draw the shift with an arrow.</li><li>Use real examples (NHS funding, supply chains).</li></ul>`,
qs:[['Explain, using a PPF, the opportunity cost of increased spending on healthcare.','Healthcare on one axis, other goods on the other. Moving along the curve to more healthcare means fewer other goods; the slope shows that trade-off. Note opportunity cost rises if resources are not equally suited to both.'],['Distinguish between a positive and a normative statement, with an example of each.','Positive: testable fact (“Inflation was 2% in 2023”). Normative: value judgement (“Inflation should be lower”).'],['Evaluate the view that a mixed economy is more efficient than a command economy. (12 marks)','Analyse price mechanism, incentives and information versus planning. Evaluate: government failure in mixed economies, equity benefits of planning, degree of mix, short vs long run. Reach a judgement.']]}}},
es:{name:'Spanish',board:'AQA 7692',c:'#e11d48',topics:{
'1-1':{t:'1.1 Los cambios en la familia',spec:['Social issues and trends in the Spanish-speaking world','Changing family structures and attitudes (traditional, single-parent, blended, unmarried couples, same-sex marriage)','The role of women: from Franco’s Sección Femenina to today','Late emancipation of young people: causes and consequences','Grammar focus: the imperfect tense (and soler, estaba + gerund)','Skills: cognates, translation into Spanish, 200-word opinion essay'],
guide:`<h2>Vocabulario clave</h2><div class="sc"><table><tr><th>Español</th><th>English</th></tr><tr><td>la familia monoparental</td><td>single-parent family</td></tr><tr><td>la familia numerosa</td><td>large family</td></tr><tr><td>la familia reconstituida</td><td>blended family</td></tr><tr><td>la pareja de hecho</td><td>unmarried couple</td></tr><tr><td>el matrimonio igualitario</td><td>same-sex marriage</td></tr><tr><td>el divorcio, la separación</td><td>divorce, separation</td></tr><tr><td>la adopción</td><td>adoption</td></tr><tr><td>la conciliación laboral y familiar</td><td>work–life balance</td></tr><tr><td>la baja por paternidad</td><td>paternity leave</td></tr><tr><td>el índice de natalidad</td><td>birth rate</td></tr><tr><td>el envejecimiento de la población</td><td>ageing population</td></tr><tr><td>la brecha generacional</td><td>generation gap</td></tr><tr><td>la igualdad de género</td><td>gender equality</td></tr></table></div>
<h2>Ideas clave</h2><ul><li><b>Familias más diversas:</b> más familias monoparentales, parejas de hecho y familias reconstituidas.</li><li><b>Menos hijos y más tarde:</b> España tiene una de las natalidades más bajas de Europa.</li><li><b>Cambios legales:</b> el matrimonio homosexual se legalizó en 2005 y el divorcio se hizo más fácil.</li><li><b>Roles de género:</b> más mujeres trabajan fuera de casa y los padres asumen más cuidado de los hijos.</li><li><b>Jóvenes y mayores:</b> los jóvenes se independizan más tarde (paro, precio de la vivienda); el envejecimiento plantea el cuidado de los mayores.</li></ul>
<h2>Gramática útil</h2><ul><li><b>Subjuntivo</b> con opiniones: <i>Es importante que los padres pasen tiempo con sus hijos.</i></li><li><b>Imperfecto vs pretérito</b> (antes/ahora): <i>Antes, la mujer se quedaba en casa; ahora trabaja fuera.</i></li><li><b>Si-clauses:</b> <i>Si tuviera hijos, compartiría las tareas.</i></li><li><b>Conectores:</b> sin embargo, por otro lado, a pesar de que, en cambio, no solo… sino también.</li></ul>
<h2>Textbook 1.1A: from Franco to today</h2><ul><li>Across many regions the idea of the family changed from the mid-20th century, but Spain changed later than the Nordic countries.</li><li><b>Under Franco</b> almost only the <b>traditional family</b> existed: a heterosexual father and mother married by the Catholic Church. The father was the <i>proveedor</i> (breadwinner); the mother raised the children and kept the house.</li><li>That model is still common, but since the end of the dictatorship, and especially from the 1980s, <i>uniones de hecho, familias monoparentales, familias reconstituidas</i> and <i>matrimonios homosexuales</i> are accepted.</li><li><b>La Sección Femenina:</b> the women’s branch of the right-wing party <b>La Falange</b>, led by <b>Pilar Primo de Rivera</b> (sister of the founder, José Antonio). It taught (<i>adoctrinaba</i>) traditional values: the woman as submissive, modest, a good wife and mother, a good Catholic and patriot, sacrificing her own life for her husband and children (“la reina callada”).</li><li>Aim: raise the <b>birth rate</b> after the huge loss of life in the Civil War. Membership was <b>compulsory</b> for young women. It was dissolved after <b>Franco died in 1975</b>.</li></ul>
<h2>Textbook 1.1B: women and independence</h2><ul><li>Audio topics: why 1975 matters (end of the dictatorship), the <b>1978 Constitution</b>, and things women could not do without <b>permiso marital</b> (work, own property or accounts, travel). Check the exact three in your recording.</li><li>Today women do not need a man to live independently: they work, earn and can be financially independent. Many women want a career as strongly as, or more than, marriage.</li><li>Discussion points: how has women entering work affected the family? who should look after the children? Note that many mothers depend on grandparents for childcare.</li></ul>
<h2>Late emancipation (textbook reading 3a)</h2><ul><li>Average age to leave home in Spain: <b>28.9</b>. About <b>8 in 10</b> under-30s still live with their parents, and 1 in 4 of those aged 30–34.</li><li><b>Causes:</b> a hard labour market (youth unemployment <b>51.4%</b>, over half of under-30 employees on temporary contracts), difficult access to housing (small rental market, weak youth policy, little social housing), and a welfare model where the <b>family</b> is the main provider and the state gives little help.</li><li><b>Consequences:</b> the later they leave, the later they form families and have children. Spain’s average of <b>1.32 children</b> per woman is among the lowest in Europe. Long term this affects the <b>ageing population</b> and pension sustainability, and experts warn of a prolonged adolescence and trouble taking on adult responsibility.</li><li>Grandparent care (task 5): the text says <b>70%</b> of over-65s look after grandchildren and <b>49%</b> do so daily. For: family bond, saves money, trusted care. Against: tiring for grandparents, they should be able to rest, and nurseries or state help are fairer alternatives.</li></ul>
<h2>Timeline (extra)</h2><div class="sc"><table><tr><th>Year</th><th>Event</th></tr><tr><td>1931</td><td>Women vote in Spain (Second Republic)</td></tr><tr><td>1939–75</td><td>Franco dictatorship; Sección Femenina</td></tr><tr><td>1975</td><td>Franco dies; Sección Femenina dissolved</td></tr><tr><td>1978</td><td>Democratic Constitution (equality before the law)</td></tr><tr><td>1981</td><td>Divorce legalised</td></tr><tr><td>2005</td><td>Same-sex marriage legalised</td></tr><tr><td>2019–21</td><td>Paternity leave extended to equal maternity leave (16 weeks)</td></tr></table></div><p class="mut">Dates beyond your textbook are from general knowledge, so check them against your teacher’s notes.</p>
<h2>Expresiones clave (textbook)</h2><ul><li>según (mis abuelos) · (no) me sorprende · entre la gente que conozco · conozco a…</li><li>mi madre dice / diría que… · lo bueno / lo malo es… · leí en una revista…</li><li>están separados / divorciados / casados · se separaron / se divorciaron / se casaron</li></ul>
<h2>Vocabulary from reading 3a</h2><div class="sc"><table><tr><th>Word</th><th>Meaning</th></tr><tr><td>dejar el nido</td><td>irse de la casa familiar</td></tr><tr><td>tardío</td><td>lento, late</td></tr><tr><td>brindar</td><td>ofrecer</td></tr><tr><td>desalentador</td><td>desmoralizador</td></tr><tr><td>la tasa de paro</td><td>el número de personas sin empleo</td></tr><tr><td>asalariados</td><td>los que ganan un sueldo</td></tr><tr><td>contrato temporal</td><td>derecho provisional a un trabajo</td></tr><tr><td>escaso</td><td>poco abundante</td></tr><tr><td>parque de vivienda social</td><td>casas disponibles para los pobres</td></tr><tr><td>a largo plazo</td><td>después de algún tiempo</td></tr><tr><td>el envejecimiento</td><td>el proceso de hacerse viejo</td></tr><tr><td>el alargamiento</td><td>la prolongación</td></tr></table></div>
<h2>Reading 2a synonyms</h2><ul><li>norteño = nórdico · sector = rama · dirección = liderazgo · doctrina = ideario · obediente = sumisa · promovía = fomentaba. For <i>desarrollado</i> and <i>avanzó</i>, look for evolucionado and transcurrió in the text and check with your teacher.</li></ul>
<h2>Strategy: cognates (es + consonant = s + consonant)</h2><ul><li>espontáneo = spontaneous · estilo = style · esférico = spherical · espaguetis = spaghetti · esposa = spouse · estatua = statue · estructura = structure · espíritu = spirit · esqueleto = skeleton · espina = spine · esponja = sponge · estigma = stigma · estabilidad = stability</li></ul>
<h2>Grammar: the imperfect tense</h2><div class="sc"><table><tr><th></th><th>-ar (hablar)</th><th>-er/-ir (comer)</th></tr><tr><td>yo</td><td>hablaba</td><td>comía</td></tr><tr><td>tú</td><td>hablabas</td><td>comías</td></tr><tr><td>él/ella</td><td>hablaba</td><td>comía</td></tr><tr><td>nosotros</td><td>hablábamos</td><td>comíamos</td></tr><tr><td>vosotros</td><td>hablabais</td><td>comíais</td></tr><tr><td>ellos</td><td>hablaban</td><td>comían</td></tr></table></div><ul><li><b>Only 3 irregulars:</b> ser (era, eras, era, éramos, erais, eran), ir (iba…), ver (veía…).</li><li><b>Use it for:</b> ongoing actions in the past, descriptions, and “used to”: <i>Antes, las mujeres no trabajaban fuera de casa.</i></li><li><b>soler + infinitive</b> = used to: <i>No solían ver la tele.</i> <b>Imperfect continuous:</b> estaba + gerund: <i>Estaba preparando la cena cuando sonó el teléfono.</i></li></ul>
<h2>Task 4: 200-word essay plan</h2><ol><li><b>Intro:</b> the role of women changed enormously since 1975.</li><li><b>Then:</b> Franco era, Sección Femenina, permiso marital (use imperfect).</li><li><b>Now:</b> work, independence, equality laws, but women still do more housework.</li><li><b>Drawbacks:</b> late children, low birth rate, stress of balancing work and family.</li><li><b>UK comparison:</b> both countries changed through work and law (UK: Equal Pay Act 1970, Sex Discrimination Act 1975), but Spain changed later.</li><li><b>Conclusion + opinion</b> with subjunctive: <i>Es importante que siga habiendo igualdad.</i></li></ol>
<h2>Frases modelo</h2><ul><li><i>La familia tradicional ya no es el único modelo aceptado en la sociedad española.</i></li><li><i>A pesar de que ha aumentado la igualdad, las mujeres siguen asumiendo la mayor parte de las tareas domésticas.</i></li></ul>
<h2>Consejos de examen</h2><ul><li>Da una opinión clara con pruebas (datos, leyes, ejemplos del mundo hispano).</li><li>Demuestra variedad: subjuntivo, condicional, pasiva, conectores.</li></ul>`,
qs:[['Textbook 2b: translate into Spanish: (1) In many parts of the world the concept of the family began to change in the 1950s. (2) Until the ’80s most families in Spain were very traditional. (3) Now society accepts many different family models.','(1) En muchas partes del mundo el concepto de la familia empezó a cambiar en los años 50. (2) Hasta los años 80 la mayoría de las familias en España eran muy tradicionales. (3) Ahora la sociedad acepta muchos modelos de familia distintos.'],['Textbook 3: imperfect. “Cuando ___ (ser) más jóvenes, mis abuelos no ___ (soler) dedicar mucho tiempo a ver la tele, pero ___ (pasar) horas en el jardín y les ___ (gustar) leer.”','eran, solían, pasaban, gustaba. Part 2: disfrutaban, tenían, querían, apetecía, podía, consideraba.'],['Textbook 3b: translate: (1) The majority of young Spanish people do not leave their parents’ home until after 25. (2) There are several reasons for this delay, including the high youth unemployment rate and the cost of renting an apartment.','(1) La mayoría de los jóvenes españoles no se van de casa de sus padres hasta después de los 25 años. (2) Hay varias razones para este retraso, entre ellas la alta tasa de paro juvenil y el coste del alquiler de un piso.'],['Textbook 3a: match 1 dejar el nido, 2 tardío, 3 brindar, 4 desalentador, 5 la tasa de paro, 6 asalariados.','1 e, 2 g, 3 b, 4 f, 5 a, 6 j. (7 l, 8 c, 9 k, 10 h, 11 i, 12 d)'],['Task 5 discussion: ¿Crees que los abuelos deberían cuidar de sus nietos? Give a 1-minute answer.','Say 70% of over-65s care for grandchildren, 49% daily. Give one benefit and one drawback, name an alternative (guardería, ayudas públicas) and finish with your opinion using Creo que… / Me parece que…'],['Translate: “Nowadays, many young people live with their parents until they are thirty because housing is too expensive.”','Hoy en día, muchos jóvenes viven con sus padres hasta los treinta años porque la vivienda es demasiado cara.'],['Write 120 words: ¿Es la familia tradicional todavía importante hoy en día?','Plan: opinión; 2 argumentos a favor; 1 en contra; conclusión. Use subjuntivo (Es importante que…) and a connector such as sin embargo.'],['Oral (1 min): ¿Cómo ha cambiado el papel del padre en la familia?','Use antes/ahora with imperfect and present, mention la baja por paternidad, and finish with an opinion.']]}}}};
const $=s=>document.querySelector(s),app=$('#app');
let done={};try{done=JSON.parse(localStorage.getItem('done')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('done',JSON.stringify(done))}catch(e){}};
function home(){let h='<h1>A-Level Study Hub</h1><p class="mut">Spec-matched notes and practice for your three A-levels. Pick a subject to start.</p><div class="grid">';
for(const k in S){const s=S[k],n=Object.keys(s.topics).length;h+=`<a class="card" style="--c:${s.c}" href="#${k}-1-1"><h3>${s.name}</h3><div class="mut">${s.board}</div><p>${n} topic live. More to come.</p></a>`}
app.innerHTML=h+'</div>'}
function topic(k,id,tab){const s=S[k],t=s.topics[id];if(!t)return home();
const tabs={ov:'Overview',gd:'Study guide',pr:'Practice'};
let h=`<div style="--c:${s.c}"><div class="crumb"><a href="#">Home</a> / ${s.name}</div><h1>${t.t}</h1><div class="mut">${s.board}</div><div class="tabs">`+
Object.keys(tabs).map(x=>`<button data-t="${x}" class="${x==tab?'on':''}">${tabs[x]}</button>`).join('')+'</div>';
if(tab=='ov'){h+='<div class="box"><b>Syllabus points covered</b><ul>'+t.spec.map(x=>`<li>${x}</li>`).join('')+'</ul><p class="mut">Check the official specification for the exact wording of each learning objective.</p></div>';if(t.tool)h+='<h3>Try it: build a number</h3><div class="bits" id="bits"></div><p id="bv"></p>'}
if(tab=='gd')h+=t.guide;
if(tab=='pr'){const d=t.qs.filter((q,i)=>done[k+id+i]).length;h+=`<p>${d} of ${t.qs.length} checked off</p><div class="bar"><i style="width:${100*d/t.qs.length}%"></i></div>`+t.qs.map((q,i)=>`<div class="q" data-i="${i}"><b>${i+1}.</b> ${q[0]}<div style="margin-top:10px"><button class="show">Show answer</button><button class="sec tick">${done[k+id+i]?'Done ✓':'Mark done'}</button></div><div class="a">${q[1]}</div></div>`).join('')}
app.innerHTML=h+'</div>';
app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{location.hash=`${k}-${id}-${b.dataset.t}`});
app.querySelectorAll('.q').forEach(q=>{q.querySelector('.show').onclick=()=>q.classList.toggle('open');q.querySelector('.tick').onclick=()=>{const key=k+id+q.dataset.i;done[key]=!done[key];save();topic(k,id,'pr')}});
if(tab=='ov'&&t.tool){const v=Array(8).fill(0),b=$('#bits');const up=()=>{const n=v.reduce((a,x)=>a*2+x,0);$('#bv').innerHTML=`<b>${n}</b> in denary, <b>0x${n.toString(16).toUpperCase().padStart(2,'0')}</b> in hex`;b.querySelectorAll('button').forEach((e,i)=>e.className=v[i]?'on':'')};
v.forEach((_,i)=>{const e=document.createElement('button');e.innerHTML=`0<small>${128>>i}</small>`;e.onclick=()=>{v[i]^=1;e.firstChild.nodeValue=v[i];up()};b.appendChild(e)});up()}}
function route(){const p=location.hash.slice(1).split('-');if(p.length<3)return home();topic(p[0],p[1]+'-'+p[2],p[3]||'ov');scrollTo(0,0)}
addEventListener('hashchange',route);route();
